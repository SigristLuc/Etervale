syntax = "proto3";

package pristontale.session;
option csharp_namespace = "PristonTale.Protocol.Session";

import "common.proto";

message EnterWorldRequest {
  string session_token = 1;
  string character_name = 2;
}
message EnterWorldReply {
  bool ok = 1;
  int32 field_id = 2;
  pristontale.common.Vec3 spawn = 3;
  uint32 entity_id = 4;
  string message = 5;
}

message ClientInput {
  oneof kind {
    MoveIntent move = 1;
    Heartbeat heartbeat = 2;
    EnterFieldIntent enter_field = 3;
    AttackIntent attack = 4;
  }
}
message MoveIntent {
  pristontale.common.Vec3 target = 1;
  bool run = 2;
}
message Heartbeat {
  uint32 client_tick = 1;
}
message EnterFieldIntent {
  int32 field_code = 1;
  pristontale.common.Vec3 position = 2;
}
message AttackIntent {
  uint64 sequence = 3; // One sequence per press; release updates the same gesture.
  uint32 target_entity_id = 1;
  bool sustained = 2; // Held attack continues until the kill; a tap allows one swing.
}

message WorldUpdate {
  repeated GroundDrop ground_added = 8;
  repeated string ground_removed = 9;
  OwnedCharacterState owner = 7;
  // Authoritative field membership; optional for compatibility with older peers.
  optional int32 field_code = 6;

  uint32 server_tick = 1;
  repeated EntitySpawn spawns = 2;
  repeated EntityState states = 3;
  repeated uint32 removed = 4;
  repeated CombatEvent combat_events = 5;
}

message CombatEvent {
  uint32 attacker_id = 1;
  uint32 target_id = 2;
  CombatEventKind kind = 3;
  float duration_ms = 4;               // SWING_BEGIN: the swing's full clip duration
  float hit_at_ms = 5;                 // SWING_BEGIN: ms from swing start until the blow lands
  int32 damage = 6;                    // HIT: resolved damage (always > 0; misses are not announced)
  bool critical = 7;                   // HIT: the crit roll succeeded
  uint32 resources = 9;                // POTION_APPLIED: life=1, mana=2, stamina=4
  bool killed = 8;                     // HIT: this blow killed the target
  int32 source_sound_code = 10;        // MONSTER_SKILL_IMPACT: original monster effect family
  pristontale.common.Vec3 position = 11; // caster origin captured at cast start, simulation coordinates
  float facing = 12;                   // caster yaw captured at cast start
}

enum CombatEventKind {
  COMBAT_EVENT_KIND_UNSPECIFIED = 0;
  COMBAT_EVENT_KIND_SWING_BEGIN = 1;
  COMBAT_EVENT_KIND_HIT = 2;
  COMBAT_EVENT_KIND_POTION_BEGIN = 3;
  COMBAT_EVENT_KIND_POTION_APPLIED = 4;
  COMBAT_EVENT_KIND_MONSTER_SKILL_IMPACT = 5;
}

message EntitySpawn {
  uint32 entity_id = 1;
  pristontale.common.EntityKind kind = 2;
  bool is_self = 3;
  pristontale.common.Vec3 position = 4;
  float facing = 5;
  pristontale.common.MoveState move_state = 6;
  int32 hp = 7;
  int32 max_hp = 8;
  oneof appearance {
    PlayerAppearance player = 9;
    uint32 template_id = 10;
  }
  // move_speed is the raw stat; attack_rate is the normalized FrameStep/80 factor.
  int32 move_speed = 11;
  float attack_rate = 12;
  uint32 attack_target_id = 13;
  uint64 attack_sequence = 14;
}

message PlayerAppearance {
  string name = 1;
  int32 job_code = 2;
  int32 tier = 3;
  int32 face_index = 4;
  int32 hair_index = 5;
  string model_name = 6;
  string model_name2 = 7;
  int32 level = 8;
  string weapon_key = 9;
  string armor_key = 10;
  string off_hand_key = 11;
  bool in_village = 12;
}

message EntityState {
  uint32 entity_id = 1;
  pristontale.common.Vec3 position = 2;
  float facing = 3;
  pristontale.common.MoveState move_state = 4;
  int32 hp = 5;
  int32 move_speed = 6;
  float attack_rate = 7;
  uint32 attack_target_id = 8;
  uint64 attack_sequence = 9;
}

message OwnedCharacterState {
  int32 level = 1;
  int64 experience = 2;
  int64 level_start = 3;
  int64 next_level = 4;
  int64 money = 5;
  int32 hp = 6;
  int32 max_hp = 7;
  int32 mp = 8;
  int32 max_mp = 9;
  int32 sp = 10;
  int32 max_sp = 11;
  int32 stat_points = 12;
  int32 skill_points = 13;
  int32 strength = 14;
  int32 spirit = 15;
  int32 talent = 16;
  int32 agility = 17;
  int32 health = 18;
  int32 damage_min = 19;
  int32 damage_max = 20;
  int32 defence = 21;
  int32 absorption = 22;
  int64 inventory_revision = 23;
  repeated OwnedItem items = 24;
  repeated OwnedSkill skills = 25;
  int64 progression_revision = 26;
  int64 skills_revision = 27;
  int32 attack_rating = 28;
  int32 move_speed = 29;
  float attack_range = 30;
}

message OwnedSkill {
  uint32 code = 1;
  int32 rank = 2;
}

message OwnedItem {
  bytes instance_id = 1;
  uint32 code = 2;
  string name = 3;
  int32 kind = 4;
  int32 count = 5;
  int32 anchor = 6;
  int32 slot = 7;
  int32 width = 8;
  int32 height = 9;
  string catalog_key = 10;
}

// Idempotent ownership operation. Success is returned only after durable storage and tick commit.
message InventoryRequest {
  string session_token = 1;
  bytes operation_id = 2;
  int64 expected_revision = 3;
  int32 action = 4;
  bytes item_id = 5;
  int32 destination = 6;
  int32 count = 7;
  int32 slot = 8;
}

message InventoryReply {
  bool ok = 1;
  int64 revision = 2;
  string message = 3;
}

message ProgressionRequest {
  string session_token = 1;
  bytes operation_id = 2;
  int64 expected_revision = 3;
  int32 action = 4;
  int32 attribute = 5;
  int32 amount = 6;
  uint32 skill_code = 7;
  uint32 npc_entity_id = 8;
}

message ProgressionReply {
  bool ok = 1;
  int64 revision = 2;
  string message = 3;
}

message NpcInteractionRequest {
  string session_token = 1;
  uint32 entity_id = 2;
}

message NpcInteractionReply {
  bool ok = 1;
  uint32 entity_id = 2;
  string name = 3;
  uint32 services = 4;
  repeated string dialog = 5;
  string message = 6;
}

message GroundDrop {
  string id = 1;
  uint32 item_code = 2;
  string catalog_key = 3;
  string name = 4;
  int32 amount = 5;
  bool gold = 6;
  pristontale.common.Vec3 position = 7;
}
